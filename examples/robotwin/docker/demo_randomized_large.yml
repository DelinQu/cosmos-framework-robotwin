# demo_randomized.yml with head/wrist cameras at Large_D435 (640x480) instead of
# D435 (320x240). Identical fovy (37) — only the pixel count differs, and 640x480
# is what the training videos were rendered at. See ../docker/README.md.
#
# Randomizes background, table clutter, table height (0.03) and lighting; camera
# pose is NOT randomized (random_head_camera_dis: 0). The training data is clean-
# domain, so this measures generalization, not fit — expect lower numbers than
# demo_clean_large and read them as a robustness axis.
#
# if you want to modify the config, please check the following tutorial first:
# https://robotwin-platform.github.io/doc/usage/configurations.html
render_freq: 0
episode_num: 50
use_seed: false
save_freq: 15
embodiment: [aloha-agilex]
language_num: 100
domain_randomization:
  random_background: true
  cluttered_table: true
  clean_background_rate: 0.02
  random_head_camera_dis: 0
  random_table_height: 0.03
  random_light: true
  crazy_random_light_rate: 0.02
camera:
  head_camera_type: Large_D435
  wrist_camera_type: Large_D435
  collect_head_camera: true
  collect_wrist_camera: true
data_type:
  rgb: true
  third_view: false
  depth: false
  pointcloud: false
  observer: false
  endpose: true
  qpos: true
  mesh_segmentation: false
  actor_segmentation: false
pcd_down_sample_num: 1024
pcd_crop: true
save_path: ./data
clear_cache_freq: 5
collect_data: true
eval_video_log: true
